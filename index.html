<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINATED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;700&display=swap');
        
        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a;
            color: #888;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background 1.5s ease;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            border-left: 1px solid #222;
            transition: all 1s ease;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 5px;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .status {
            font-size: 0.8rem;
            color: #444;
            margin-bottom: 40px;
            font-family: monospace;
        }

        .message {
            font-size: 1.1rem;
            line-height: 2;
            margin-bottom: 40px;
        }

        .line {
            width: 40px;
            height: 1px;
            background: #e91e63;
            margin: 20px auto;
            opacity: 0.3;
        }

        .btn-exit {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 12px 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.4s ease;
            outline: none;
        }

        .btn-exit:hover {
            border-color: #fff;
            color: #fff;
        }

        /* تأثير التلاشي عند الخروج */
        .disintegrate {
            filter: blur(15px);
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        /* رسالة الكرامة النهائية */
        #final-ego-statement {
            position: fixed;
            display: none;
            text-align: center;
            width: 80%;
            color: #fff;
            animation: fadeInSimple 2s forwards;
        }

        @keyframes fadeInSimple {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .ego-text {
            font-size: 1.8rem;
            font-weight: 300;
            line-height: 1.8;
        }

        .fade-in {
            animation: fadeIn 2.5s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="main-content" class="container fade-in">
        <div class="status">LOG_SYSTEM: DISCONNECTED <p>LOG_DATE: 20/04/2025 - 06/05/2026</p></div>
        <h1>تم الانتهاء</h1>
        
        <div class="line"></div>

        <div class="message">
            قيل ما قيل، واكتملت الحكاية بآخر نقطة.<br>
            الذكريات لم تعد صالحة للاستخدام،<br>
            والوعود التي لا تُصان.. تُنسى.
        </div>

        <div class="line"></div>

        <button class="btn-exit" onclick="executeExit()">إغلاق الأرشيف</button>
    </div>

    <div id="final-ego-statement">
        <div class="ego-text">
            "لا أتمسك بيدٍ سمحت ليدي بالافلات، <br>
            ولا أقرأ كتاباً رفض أن يكتمل بي."
            <br>
            <span style="font-size: 0.9rem; color: #444; margin-top: 20px; display: block;">تم مسح الذاكرة بنجاح.</span>
        </div>
    </div>

    <script>
        function executeExit() {
            const content = document.getElementById('main-content');
            const statement = document.getElementById('final-ego-statement');

            // 1. تفعيل تأثير التلاشي للمحتوى الحالي
            content.classList.add('disintegrate');

            // 2. إظهار رسالة الكرامة بعد ثانية من التلاشي
            setTimeout(() => {
                content.style.display = 'none';
                statement.style.display = 'block';
                document.body.style.backgroundColor = '#000'; // تعميق السواد
            }, 1000);
        }
    </script>
</body>
</html>
