<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The End | النهاية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;600&display=swap');
        
        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a; /* أسود عميق */
            color: #888;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            border-left: 1px solid #333;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 5px;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .status {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 40px;
            font-family: monospace;
        }

        .message {
            font-size: 1.2rem;
            line-height: 2;
            margin-bottom: 50px;
        }

        .line {
            width: 50px;
            height: 1px;
            background: #e91e63; /* لمسة لون واحدة تدل على ما فات */
            margin: 20px auto;
            opacity: 0.5;
        }

        .btn-exit {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 12px 30px;
            text-decoration: none;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .btn-exit:hover {
            border-color: #fff;
            color: #fff;
            background: #111;
        }

        /* أنيميشن بسيط للاختفاء */
        .fade-in {
            animation: fadeIn 3s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container fade-in">
        <div class="status">LOG_DATE: 20/04/2025 - 06/05/2026</div>
        <h1>تم الانتهاء</h1>
        
        <div class="line"></div>

        <div class="message">
            قيل ما قيل، واكتملت الحكاية بآخر نقطة.<br>
            الذكريات لم تعد صالحة للاستخدام،<br>
            والوعود التي لا تُصان.. تُنسى.
        </div>

        <div class="message" style="font-size: 1rem; color: #444;">
            (تم إغلاق الأرشيف نهائياً)
        </div>

        <div class="line"></div>

        <a href="about:blank" class="btn-exit">خروج</a>
    </div>

    <script>
        // لا يوجد عداد، لا توجد قلوب، لا توجد تفاصيل. الصمت هو أبلغ رد.
        console.log("Connection closed by user.");
    </script>
</body>
</html>
