<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكرياتنا بالصور والفيديوهات - شاهي ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:ital@0;1&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff0f5, #fce4ec, #f8bbd0);
            font-family: 'Cairo', sans-serif;
            color: #4a148c;
        }
        
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 3.3rem;
            color: #e91e63;
            margin-bottom: 15px;
        }
        
        .subtitle {
            text-align: center;
            font-size: 1.55rem;
            font-family: 'Amiri', serif;
            color: #9c27b0;
            margin-bottom: 60px;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 32px;
            justify-content: center;   /* مركزة في الصفحة */
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .gallery-item {
            position: relative;
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(233, 30, 99, 0.28);
            transition: all 0.4s ease;
            background: #000;
            aspect-ratio: 16 / 9;
        }
        
        .gallery-item:hover {
            transform: translateY(-15px);
            box-shadow: 0 30px 65px rgba(233, 30, 99, 0.4);
        }
        
        .gallery-item img,
        .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #101010;
            display: block;
        }
        
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(233,30,99,0.88));
            color: white;
            padding: 22px 15px 16px;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
            font-size: 1.18rem;
        }
        
        .gallery-item:hover .overlay {
            opacity: 1;
        }
        
        .back-btn {
            display: block;
            text-align: center;
            margin: 80px auto 40px;
            padding: 18px 60px;
            background: linear-gradient(#e91e63, #c2185b);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.5rem;
            box-shadow: 0 15px 35px rgba(233,30,99,0.4);
            max-width: 300px;
        }
        
        .back-btn:hover {
            transform: scale(1.08);
        }
        
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.93);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        .lightbox-content {
            max-width: 90%;
            max-height: 85vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
       .lightbox-content img, 
       .lightbox-content video {
           max-width: 100%;
           max-height: 85vh;
           object-fit: contain; /* يضمن بقاء الصورة كاملة دون قص */
           border-radius: 12px; /* لمسة جمالية */
           box-shadow: 0 0 30px rgba(0,0,0,0.5);
}
            
        
        
        .close {
            position: absolute;
            top: -18px;
            right: -18px;
            background: #e91e63;
            color: white;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ذكرياتنا الجميلة ❤️</h1>
        <p class="subtitle">صور وفيديوهات مع شاهي... لحظات خاصة</p>
        
        <div class="gallery-grid">
            <!-- الصور الثلاث -->
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="img1.jpg" alt="ذكرى 1">
                <div class="overlay">ذكرى 1</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="img2.jpg" alt="ذكرى 2">
                <div class="overlay">ذكرى 2</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="img3.jpg" alt="ذكرى 3">
                <div class="overlay">ذكرى 3</div>
            </div>

            <!-- الفيديوهات الأربعة (بدون أيقونة Play) -->
            <div class="gallery-item" onclick="openLightbox(this)">
                <video muted loop poster="v1.jpg">
                    <source src="v1.mp4" type="video/mp4">
                </video>
                <div class="overlay">فيديو 1</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(this)">
                <video muted loop poster="v2.jpg">
                    <source src="v2.mp4" type="video/mp4">
                </video>
                <div class="overlay">فيديو 2</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(this)">
                <video muted loop poster="v3.jpg">
                    <source src="v3.mp4" type="video/mp4">
                </video>
                <div class="overlay">فيديو 3</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(this)">
                <video muted loop poster="v4.jpg">
                    <source src="v4.mp4" type="video/mp4">
                </video>
                <div class="overlay">فيديو 4</div>
            </div>
        </div>
        
                    <div class="gallery-item" onclick="openLightbox(this)">
                <video muted loop poster="v5.jpg">
                    <source src="v5.mp4" type="video/mp4">
                </video>
                <div class="overlay">فيديو 5</div>
            </div>
        </div>
        
        <a href="index.html" class="back-btn">← ارجع لحكايتنا الكاملة</a>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="if(event.target === this) closeLightbox()">
        <div class="lightbox-content" id="lightboxContent">
            <span class="close" onclick="closeLightbox()">×</span>
        </div>
    </div>

    <script>
        function openLightbox(element) {
            const lightbox = document.getElementById('lightbox');
            const content = document.getElementById('lightboxContent');
            content.innerHTML = '<span class="close" onclick="closeLightbox()">×</span>';
            
            const clone = element.querySelector('img, video').cloneNode(true);
            if (clone.tagName === 'VIDEO') {
                clone.controls = true;
                clone.autoplay = true;
                clone.muted = false;
            }
            content.appendChild(clone);
            
            lightbox.style.display = 'flex';
        }
        
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            const videos = lightbox.querySelectorAll('video');
            videos.forEach(v => v.pause());
            lightbox.style.display = 'none';
        }
        
        function openLightbox(element) {
    const lightbox = document.getElementById('lightbox');
    const content = document.getElementById('lightboxContent');
    
    // إفراغ المحتوى القديم مع الحفاظ على زر الإغلاق
    content.innerHTML = '<span class="close" onclick="closeLightbox()">&times;</span>';
    
    const media = element.querySelector('img, video');
    const clone = media.cloneNode(true);

    if (media.tagName === 'VIDEO') {
        clone.controls = true;
        clone.autoplay = true;
        clone.muted = false; // تشغيل الصوت عند الفتح في الـ Lightbox
        clone.style.width = '100%';
        clone.style.height = 'auto';
        clone.style.maxHeight = '90vh';
    }

    content.appendChild(clone);
    lightbox.style.display = 'flex';
    
    // منع التمرير في الخلفية عند فتح الصورة/الفيديو
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    const lightbox = document.getElementById('lightbox');
    lightbox.style.display = 'none';
    
    // تفريغ المحتوى لإيقاف الفيديو تماماً
    const content = document.getElementById('lightboxContent');
    content.innerHTML = ''; 
    
    // إعادة التمرير
    document.body.style.overflow = 'auto';
}

    </script>
</body>
</html>
